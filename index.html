<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Juice Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #fff;
    --panel: rgba(20, 8, 30, 0.78);
    --panel-edge: rgba(255, 255, 255, 0.14);
    --accent: #ffe14d;
    --accent-ink: #2a1500;
    --muted: rgba(255, 255, 255, 0.7);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14081e; color: var(--ink);
    font-family: "Fredoka", ui-rounded, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .overlay.hidden { display: none; }
  .card { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 24px; padding: 28px 28px 24px;
    width: min(460px, 100%); text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45); max-height: calc(100vh - 32px); overflow-y: auto; }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 62px); line-height: 1; letter-spacing: 0.5px; font-weight: 700;
    background: linear-gradient(90deg, #ff6ad5, #ffd166, #7dffb3); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 0 0 6px; font-size: 34px; font-weight: 700; }
  .sub { color: var(--muted); margin: 8px 0 18px; font-size: 16px; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px; }
  .fruits { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 20px; }
  @media (max-width: 480px) { .fruits { grid-template-columns: repeat(3, 1fr); } }
  .fruit-btn { background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 16px; padding: 8px 4px 6px;
    color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; transition: transform .12s, border-color .12s, background .12s; }
  .fruit-btn { min-width: 0; padding: 6px 2px 5px; }
  .fruit-btn canvas { width: 100%; max-width: 52px; height: auto; aspect-ratio: 1; display: block; margin: 0 auto 2px; }
  .fruit-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.1); }
  .fruit-btn.sel { border-color: var(--accent); background: rgba(255,225,77,0.12); }
  .levels { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .level-btn { background: rgba(255,255,255,0.06); border: 2px solid transparent; border-radius: 16px; padding: 10px 12px;
    color: var(--ink); font: inherit; cursor: pointer; text-align: left; transition: transform .12s, border-color .12s, background .12s; }
  .level-btn:hover { transform: translateY(-2px); background: rgba(255,255,255,0.1); }
  .level-btn.sel { border-color: var(--accent); background: rgba(255,225,77,0.12); }
  .level-btn b { display: block; font-size: 19px; margin-bottom: 4px; }
  .level-btn small { display: block; color: var(--muted); font-size: 12px; }
  .speeds { display: flex; align-items: center; gap: 10px; margin: 0 auto 20px; max-width: 340px; }
  .speed-end { font-size: 12px; color: var(--muted); }
  .speed-val { min-width: 54px; padding: 4px 10px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 15px; }
  .speeds input[type=range] { flex: 1; min-width: 0; -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; cursor: pointer;
    background: linear-gradient(90deg, var(--accent) var(--fill, 50%), rgba(255,255,255,0.15) var(--fill, 50%)); }
  .speeds input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .speeds input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 3px solid var(--accent); }
  .speeds input[type=range]:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .btn { display: inline-block; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    font: inherit; font-weight: 700; font-size: 20px; padding: 12px 36px; cursor: pointer; box-shadow: 0 6px 0 #c9a500; transition: transform .08s, box-shadow .08s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a500; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border: 2px solid var(--panel-edge); font-size: 17px; padding: 10px 24px; }
  .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 16px; line-height: 1.6; }
  kbd { background: rgba(255,255,255,0.12); border-radius: 6px; padding: 1px 7px; font-family: inherit; font-size: 12px; }
  .stats { display: flex; justify-content: center; gap: 28px; margin: 14px 0 22px; }
  .stat b { display: block; font-size: 30px; }
  .stat span { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }

  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; align-items: center; justify-content: center; gap: 12px; pointer-events: none; padding: 0 16px; }
  #hud.hidden { display: none; }
  .bar { width: min(420px, 55vw); height: 14px; border-radius: 999px; background: rgba(0,0,0,0.35); border: 2px solid rgba(255,255,255,0.35); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7dffb3, #ffe14d); border-radius: 999px; }
  #pct { font-weight: 700; min-width: 48px; font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,0.5); }
  .icon-btn { pointer-events: auto; position: fixed; top: 8px; width: 40px; height: 40px; border-radius: 12px; border: 0;
    background: rgba(0,0,0,0.3); color: #fff; font-size: 18px; cursor: pointer; }
  #muteBtn { right: 12px; }
  #pauseBtn { left: 12px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div class="bar"><i id="barFill"></i></div>
  <div id="pct">0%</div>
  <button class="icon-btn" id="pauseBtn" title="Pause (Esc)">❚❚</button>
  <button class="icon-btn" id="muteBtn" title="Mute (M)">♪</button>
</div>

<div id="menu" class="overlay">
  <div class="card">
    <h1>Juice Rush</h1>
    <p class="sub" id="menuSub"></p>
    <div class="label">Choose a level</div>
    <div class="levels" id="levelPicker"></div>
    <div class="label">Choose your fruit</div>
    <div class="fruits" id="fruitPicker"></div>
    <div class="label">Game speed</div>
    <div class="speeds" role="group" aria-label="Game speed"></div>
    <button class="btn" id="playBtn">Play</button>
    <div class="hint" id="bestLine"></div>
    <div class="hint"><kbd>Space</kbd> / <kbd>↑</kbd> / click / tap to jump · hold to keep hopping · burst once and keep going as a seed<br><kbd>Esc</kbd> pause · <kbd>M</kbd> mute · <kbd>[</kbd> <kbd>]</kbd> speed</div>
  </div>
</div>

<div id="pause" class="overlay hidden">
  <div class="card">
    <h2>Paused</h2>
    <p class="sub" id="pauseInfo"></p>
    <div class="label">Game speed</div>
    <div class="speeds" role="group" aria-label="Game speed"></div>
    <div class="row">
      <button class="btn" id="resumeBtn">Resume</button>
      <button class="btn ghost" id="pauseMenuBtn">Menu</button>
    </div>
  </div>
</div>

<div id="win" class="overlay hidden">
  <div class="card">
    <h2 id="winTitle">Level Complete!</h2>
    <p class="sub">Freshly squeezed. Try another speed?</p>
    <div class="speeds" role="group" aria-label="Game speed"></div>
    <div class="stats">
      <div class="stat"><b id="winAttempts">1</b><span>Attempts</span></div>
      <div class="stat"><b id="winJumps">0</b><span>Jumps</span></div>
    </div>
    <div class="row">
      <button class="btn" id="nextBtn">Next level</button>
      <button class="btn" id="againBtn">Play again</button>
      <button class="btn ghost" id="winMenuBtn">Menu</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

/* ================= Constants & physics ================= */
const SPEED = 10;      // tiles per second
const G = 100;         // gravity, tiles/s^2
const JV = 21;         // jump velocity
const PADV = 30;       // jump pad launch velocity
const ORBV = 20;       // jump ring velocity
const SHIP_G = 28;     // spaceship falls with this when the button is released
const SHIP_UP = 28;    // ...and rises with this while the button is held
const SHIP_MAXRISE = 6, SHIP_MAXFALL = -7;   // gentle top speeds so the ship glides rather than darts
const WAVE_V = 10;     // wave moves diagonally: vertical speed equals running speed (45°)
const WAVE_INSET = 0.28; // wave hitbox is shrunk by this fraction on each side
const SEED = 0.6;      // hitbox size after the fruit bursts into its seed
const SEED_SAFE = 0.6; // seconds of invulnerability right after bursting
const PS = 0.9;        // player hitbox size (tiles)
const STEP = 1 / 240;  // fixed physics step

/* ================= Levels =================
   Naming rule: every level is named after a fruit, in alphabetical order
   (Apple, Banana, Cherry, ...), and difficulty rises from A to Z.
   Builder helpers (all positions in tiles; y = 0 is the floor):
     B(x, y, w, h, kind?)  solid block / appliance ("cabinet" = hanging upper cupboard)
     S(x, y, n)            n upright knives/forks standing on y
     D(x, y, n)            n knives hanging point-down from the underside at y + 1
     PAD(x, y)  launch pan     O(x, y)  jump ring     H(x, y, text)  hint     END(x)  finish line
     PORTAL(x, "flip" | "normal")      gravity portal: "flip" makes the fruit fall up and run along
                                       the undersides of blocks (jumps go downward); "normal" undoes it
     PORTAL(x, "wave", ceil)           wave: hold = fly diagonally up, release = diagonally down; tiny
                                       hitbox, touching any block is a hit, floor/ceiling are safe
     PORTAL(x, "ship" | "cube", ceil)  transform portal; in ship mode taps flap (Flappy-style) and
                                       the ship can't fly above `ceil` */
const LEVELS = [
  {
    id: "apple", name: "Apple",
    themes: [
      { at: 0,   top: "#2b1055", bot: "#d53a9d", ground: "#3a0f4a", accent: "#ff6ad5" }, // berry dusk
      { at: 66,  top: "#0f3443", bot: "#2fbf8a", ground: "#0b3b2e", accent: "#7dffb3" }, // lime grove
      { at: 104, top: "#1a2a6c", bot: "#f0a92a", ground: "#3b2a0a", accent: "#ffd166" }, // citrus sky
      { at: 154, top: "#3a0010", bot: "#ff4e50", ground: "#2a0508", accent: "#ff9a8b" }, // watermelon
      { at: 199, top: "#0b1a4a", bot: "#5b6cff", ground: "#0a1030", accent: "#9fb4ff" }, // blueberry
      { at: 256, top: "#13210a", bot: "#7fbf3f", ground: "#0d1a06", accent: "#d9ff8a" }, // kiwi
    ],
    build({ B, S, PAD, O, H, END }) {
      // Section 1 — warm-up hops (singles only)
      H(10, 3.2, "Tap, click or press Space to jump");
      S(16); S(24); S(30); B(37, 0, 1, 1); S(44); S(50); B(56, 0, 3, 1); S(63);
      // Section 2 — appliances, stairs and pits
      B(66, 0, 2, 1); B(68, 0, 2, 2); B(70, 0, 3, 3); S(78);
      B(84, 0, 3, 1); S(87, 0, 2); B(89, 0, 3, 1);
      B(95, 0, 5, 1); S(98, 1);
      // Section 3 — pans & rings
      H(105, 3.4, "Hot pans launch you");
      PAD(108); S(110, 0, 3);
      H(117, 4.2, "Tap inside a ring to jump mid-air");
      S(120, 0, 4); O(120, 1.5);
      PAD(134); S(138, 0, 7); B(138, 2, 7, 1); S(150);
      // Section 4 — microwave hops and a ring chain
      S(156); B(162, 0, 2, 1); S(164); B(165, 0, 2, 1); S(167); B(168, 0, 2, 1); S(176);
      S(184, 0, 12); O(185, 1.5); O(189, 1.5); O(193, 1.5);
      // Section 5 — pans & rings
      H(200, 3.6, "Final stretch: pans & rings!");
      PAD(202); S(204, 0, 3);
      S(212, 0, 8); O(213, 1.5); O(217, 1.5);
      PAD(226); S(230, 0, 6); B(230, 2, 6, 1); O(232.5, 4.2);
      PAD(242); S(244, 0, 6); O(246, 2.65);
      // Section 6 — kiwi encore
      S(262); B(268, 0, 2, 1); S(270); B(271, 0, 2, 1); S(278);
      PAD(284); S(286, 0, 3);
      B(294, 0, 3, 1); S(297, 0, 2); B(299, 0, 3, 1);
      S(308); S(314, 0, 4); O(314, 1.5);
      END(322);
    },
  },
  {
    id: "banana", name: "Banana",
    themes: [
      { at: 0,   top: "#10162e", bot: "#3c4a8f", ground: "#0c1022", accent: "#ffe135" }, // midnight pantry
      { at: 48,  top: "#2a1a05", bot: "#c9821b", ground: "#231503", accent: "#fff3a0" }, // caramel
      { at: 96,  top: "#05261c", bot: "#1f9e6e", ground: "#041b14", accent: "#d4ff5c" }, // green banana
      { at: 140, top: "#2b0a2e", bot: "#b8337a", ground: "#1e0620", accent: "#ffd23f" }, // banana split
      { at: 190, top: "#2a1a00", bot: "#e0a800", ground: "#1f1300", accent: "#fff8c4" }, // ripe banana
    ],
    build({ B, S, D, PAD, O, H, END }) {
      const CAB = (x, w) => B(x, 3.2, w, 30, "cabinet");  // upper cupboard reaching the ceiling, underside at y = 3.2
      const HANG = (x, n = 1) => D(x, 2.2, n);             // knife hanging under a cupboard
      // Section 1 — first cupboards
      H(8, 2.6, "Knives hang from the cupboards too!");
      S(14); S(20, 0, 2);
      CAB(26, 10); HANG(28); S(30); HANG(33);
      S(40, 0, 2);
      // Section 2 — knife sandwich
      CAB(50, 16); S(53); HANG(56); S(58, 0, 2); HANG(61); S(63);
      S(69); B(74, 0, 5, 1); S(77, 1); S(83, 0, 2);
      // Section 3 — pans, rings and a cupboard gap
      PAD(88); S(90, 0, 3);
      S(100, 0, 8); O(101, 1.5); O(105, 1.5);
      CAB(112, 8); S(114); HANG(117);
      PAD(124); S(126, 0, 7); B(126, 2, 7, 1); S(130, 3);
      // Section 4 — the long cupboard run, then rings
      CAB(140, 22); S(143); HANG(146); S(148); HANG(151); S(153); HANG(156); S(158);
      S(166, 0, 2);
      S(172, 0, 12); O(173, 1.5); O(177, 1.5); O(181, 1.5);
      // Section 5 — ripe encore
      CAB(196, 10); HANG(198); S(200); HANG(203);
      S(210, 0, 2); PAD(216); S(218, 0, 3);
      CAB(224, 10); S(227); HANG(230); S(232, 0, 2);
      END(240);
    },
  },
  {
    id: "cherry", name: "Cherry",
    themes: [
      { at: 0,   top: "#2a0010", bot: "#9b1238", ground: "#1c000a", accent: "#ff4d6d" }, // cherry red
      { at: 56,  top: "#05010f", bot: "#2a0f5c", ground: "#07031a", accent: "#ff5cf0" }, // space pantry
      { at: 150, top: "#1a0f2e", bot: "#6b1f6b", ground: "#12081f", accent: "#ffd23f" }, // cherry night
      { at: 214, top: "#05010f", bot: "#1f2a6b", ground: "#07031a", accent: "#5cf0ff" }, // second launch
    ],
    build({ B, S, D, PAD, O, H, PORTAL, END }) {
      const CAB = (x, w, y = 3.2) => B(x, y, w, 30, "cabinet");
      const HANG = (x, y = 2.2, n = 1) => D(x, y, n);
      // a "pipe" for the ship section: appliance from the floor, cupboard from the ceiling, gap in between
      const PIPE = (x, gapLo, gapHi) => {
        if (gapLo > 0) B(x, 0, 2, gapLo, gapLo >= 2.5 ? "fridge" : gapLo >= 1.5 ? "oven" : "microwave");
        B(x, gapHi, 2, 6.5 - gapHi, "cabinet");   // stops at the ship ceiling (6.5)
      };
      // Section 1 — fruit warm-up under the cupboards
      S(12, 0, 2); S(18, 0, 2);
      CAB(24, 10); S(27); HANG(30); S(32, 0, 2);
      S(40); PAD(44); S(46, 0, 3);
      // Section 2 — blast off: Flappy-style spaceship
      H(54, 3.2, "Spaceship! Hold to rise, let go to fall");
      PORTAL(60, "ship"); CAB(61, 99, 6.5);
      PIPE(70, 1, 4); PIPE(78, 2, 5); PIPE(86, 0, 3); PIPE(94, 3, 6);
      PIPE(102, 1.5, 4); PIPE(110, 2.5, 5); PIPE(117, 1, 3.6); PIPE(124, 3, 5.6);
      S(130, 0, 12); CAB(132, 9, 4.6); HANG(134, 3.6); HANG(138, 3.6);
      PIPE(146, 2, 4.6); PIPE(153, 0.8, 3.4);
      PORTAL(160, "cube");
      // Section 3 — back on foot for the finale
      H(162, 3.2, "Back to fruit!");
      S(168, 0, 2);
      CAB(174, 16); S(177); HANG(180); S(182); HANG(185); S(187);
      S(196, 0, 12); O(197, 1.5); O(201, 1.5); O(205, 1.5);
      // Section 4 — second launch
      PORTAL(220, "ship"); CAB(221, 30, 6.5);
      PIPE(228, 1.5, 4); PIPE(235, 2.5, 5); PIPE(242, 0.8, 3.3);
      PORTAL(250, "cube");
      S(256, 0, 2); S(262);
      END(270);
    },
  },
  {
    id: "dragonfruit", name: "Dragonfruit",
    themes: [
      { at: 0,   top: "#1a0420", bot: "#c41e6a", ground: "#14021a", accent: "#7dff6a" }, // dragon skin
      { at: 62,  top: "#04202a", bot: "#0f7a7a", ground: "#031418", accent: "#ff4fa8" }, // upside-down lagoon
      { at: 156, top: "#05010f", bot: "#3a0a5c", ground: "#07031a", accent: "#7dff6a" }, // night flight
      { at: 220, top: "#2a0018", bot: "#ff2e88", ground: "#1a0010", accent: "#fff35c" }, // dragon fire
    ],
    build({ B, S, D, PAD, O, H, PORTAL, END }) {
      const CAB = (x, w, y = 3.2) => B(x, y, w, 30, "cabinet");
      const HANG = (x, y = 2.2, n = 1) => D(x, y, n);
      const PIPE = (x, gapLo, gapHi) => {
        if (gapLo > 0) B(x, 0, 2, gapLo, gapLo >= 2.5 ? "fridge" : gapLo >= 1.5 ? "oven" : "microwave");
        B(x, gapHi, 2, 6.5 - gapHi, "cabinet");
      };
      // Section 1 — on foot, no warm-up
      S(12, 0, 2); S(18, 0, 2);
      CAB(24, 16); S(27); HANG(30); S(32, 0, 2); HANG(35); S(37);
      S(46, 0, 2); PAD(52); S(54, 0, 3);
      // Section 2 — upside down: gravity pulls you to the cupboards, jumps go downward
      H(58, 3.4, "Upside down! Jumps now go downward");
      PORTAL(64, "flip"); CAB(64, 88, 5);
      D(74, 4); D(80, 4, 2);                                   // knives on the cupboard you run along
      B(86, 0, 24, 1.8, "counter");                            // counter reaching up from below...
      D(87, 4); S(90, 1.8); D(92, 4); S(95, 1.8); D(97, 4);    // ...with knives on it, alternating with
      S(100, 1.8); D(102, 4); S(105, 1.8); D(107, 4);          //    knives above
      D(116, 4, 12); O(117, 2.5); O(121, 2.5); O(125, 2.5);    // ring chain, mirrored
      D(134, 4, 2); D(140, 4);
      PORTAL(148, "normal");
      // Section 3 — night flight, tighter gaps than Cherry
      H(154, 3.2, "Hold to rise!");
      PORTAL(160, "ship"); CAB(161, 59, 6.5);
      PIPE(168, 1, 3.6); PIPE(175, 2.2, 4.8); PIPE(182, 0.6, 3.2); PIPE(189, 2.8, 5.4);
      PIPE(196, 1.4, 4); PIPE(203, 3, 5.6); PIPE(210, 1, 3.6);
      PORTAL(218, "cube");
      // Section 4 — dragon-fire finale
      S(224, 0, 2);
      CAB(230, 16); S(233); HANG(236); S(238, 0, 2); HANG(241); S(243);
      S(252, 0, 12); O(253, 1.5); O(257, 1.5); O(261, 1.5);
      S(270, 0, 2); S(276);
      END(284);
    },
  },
  {
    id: "elderberry", name: "Elderberry",
    themes: [
      { at: 0,   top: "#0d0618", bot: "#4b1d6b", ground: "#08030f", accent: "#c08bff" }, // elderberry night
      { at: 78,  top: "#03141a", bot: "#0f5a6b", ground: "#020c10", accent: "#5cffb0" }, // wave lagoon
      { at: 140, top: "#120618", bot: "#6b1d5a", ground: "#0a030d", accent: "#ff8ad8" }, // syrup flight
      { at: 202, top: "#001a12", bot: "#127a4a", ground: "#00100a", accent: "#e8ff5c" }, // elderflower
    ],
    build({ B, S, D, H, PORTAL, END }) {
      const CAB = (x, w, y) => B(x, y, w, 30, "cabinet");
      const PIPE = (x, gapLo, gapHi) => {
        if (gapLo > 0) B(x, 0, 2, gapLo, gapLo >= 2.5 ? "fridge" : gapLo >= 1.5 ? "oven" : "microwave");
        B(x, gapHi, 2, 6.5 - gapHi, "cabinet");
      };
      // wave "teeth": UP rises from the floor to height h; DOWN hangs from the ceiling down to y
      const UP = (x, h, w = 1) => B(x, 0, w, h, h >= 2.5 ? "fridge" : h >= 1.5 ? "oven" : "toaster");
      const DOWN = (x, y, ceil, w = 1) => B(x, y, w, ceil - y, "cabinet");
      // Section 1 — straight into the spaceship
      H(4, 3.2, "No running today: hold to fly!");
      PORTAL(1, "ship"); CAB(2, 76, 6.5);

function buildLevel(def) {
  const lv = { id: def.id, name: def.name, themes: def.themes,
               blocks: [], spikes: [], pads: [], orbs: [], hints: [], portals: [], end: 0 };
  def.build({
    B: (x, y, w = 1, h = 1, kind) => lv.blocks.push({ x, y, w, h, kind }),
    S: (x, y = 0, n = 1) => { for (let i = 0; i < n; i++) lv.spikes.push({ x: x + i, y }); },
    D: (x, y, n = 1) => { for (let i = 0; i < n; i++) lv.spikes.push({ x: x + i, y, down: true }); },
    PAD: (x, y = 0) => lv.pads.push({ x, y }),
    O: (x, y) => lv.orbs.push({ x, y }),
    PORTAL: (x, mode, ceil = 6.5) => lv.portals.push({ x, mode, ceil }),
    H: (x, y, text) => lv.hints.push({ x, y, text }),
    END: x => { lv.end = x; },

}

/* ================= Simulation (pure, used by game & solver) ================= */
const EV_JUMP = 1, EV_LAND = 2, EV_PAD = 4, EV_ORB = 8, EV_PORTAL = 16, EV_BURST = 32;
function newState() {
  return { x: 0, y: 0, vy: 0, grounded: true, dead: false, won: false, orbs: 0, buf: 0, ev: 0, jumps: 0,
           ship: false, wave: false, ceil: 0, portals: 0, thrust: false, flip: false,   // flip = gravity pulls upward
           size: PS, seed: false, inv: 0 };   // size shrinks to SEED when the fruit bursts

const overlap = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

// First hit bursts the fruit and leaves a smaller seed that keeps going (briefly invulnerable).
// A hit on the seed ends the attempt. Returns true when the attempt is over.
function hurt(s) {

  if (!s.seed) {
    s.seed = true; s.x += (s.size - SEED) / 2; s.size = SEED; s.inv = SEED_SAFE;
    if (!s.ship && !s.wave) { s.vy = s.flip ? Math.min(s.vy, -8) : Math.max(s.vy, 8); s.grounded = false; }
    s.ev |= EV_BURST;
    return false;
  }
  s.dead = true;
  return true;
}

function simStep(s, held, pressed, n) {
  if (pressed) s.buf = 0.12;
  for (let k = 0; k < n; k++) {
    const h = STEP, py = s.y, wasGrounded = s.grounded, sz = s.size;
    s.thrust = (s.ship || s.wave) && held;
    if (s.wave) s.vy = held ? WAVE_V : -WAVE_V;              // wave: straight diagonal up or down
    else if (s.ship) s.vy = Math.min(SHIP_MAXRISE, Math.max(SHIP_MAXFALL, s.vy + (held ? SHIP_UP : -SHIP_G) * h));
    else if (s.flip) s.vy = Math.min(s.vy + G * h, 40);   // upside down: falls toward the ceiling
    else s.vy = Math.max(s.vy - G * h, -40);
    s.y += s.vy * h;
    s.x += SPEED * h;
    s.grounded = false;
    if (s.y <= 0) { s.y = 0; s.vy = s.wave ? s.vy : 0; s.grounded = !s.flip || s.ship || s.wave; }   // floor is safe to slide on
    if ((s.ship || s.wave) && s.y + sz > s.ceil) { s.y = s.ceil - sz; if (s.vy > 0 && s.ship) s.vy = 0; }   // so is the ceiling

    const ins = s.wave ? s.size * WAVE_INSET : 0;
    for (const b of L.blocks) {
      if (b.x > s.x + 2 || b.x + b.w < s.x - 1) continue;
      if (s.wave) {   // the wave can't land on anything: touching a block is a hit
        if (overlap(s.x + ins, s.y + ins, s.size - 2 * ins, s.size - 2 * ins, b.x, b.y, b.w, b.h) && hurt(s)) return s;
        continue;
      }
      if (s.x + s.size > b.x && s.x < b.x + b.w) {
        const top = b.y + b.h;
        if (s.y < top && s.y + s.size > b.y) {
          if (!s.flip && s.vy <= 0 && py >= top - 0.35) { s.y = top; s.vy = 0; s.grounded = true; }
          else if (s.flip && !s.ship && s.vy >= 0 && py + s.size <= b.y + 0.35) { s.y = b.y - s.size; s.vy = 0; s.grounded = true; }  // land on an underside
          else if (hurt(s)) return s;
        }
      }
    }
    if (s.grounded && !wasGrounded && !s.ship) s.ev |= EV_LAND;

    for (let i = 0; i < L.portals.length; i++) {
      const pt = L.portals[i];
      if (!(s.portals & (1 << i)) && s.x + s.size >= pt.x) {
        s.portals |= 1 << i; s.ev |= EV_PORTAL;
        if (pt.mode === "ship") { s.ship = true; s.wave = false; s.ceil = pt.ceil; s.vy = Math.min(s.vy, 4); }
        else if (pt.mode === "wave") { s.wave = true; s.ship = false; s.ceil = pt.ceil; }
        else if (pt.mode === "cube") { s.ship = false; s.wave = false; }
        else if (pt.mode === "flip") { s.flip = true; s.grounded = false; }
        else if (pt.mode === "normal") { s.flip = false; s.grounded = false; }
      }
    }

    if (!s.ship && !s.wave && s.grounded && (held || s.buf > 0)) {
      s.vy = s.flip ? -JV : JV; s.grounded = false; s.buf = 0; s.ev |= EV_JUMP; s.jumps++;
    }
    if (s.ship || s.wave) s.buf = 0;
    if (!s.ship && !s.wave) for (const p of L.pads) {
      if ((s.flip ? -s.vy : s.vy) < PADV - 5 && overlap(s.x, s.y, s.size, s.size, p.x + 0.1, p.y, 0.8, 0.3)) {
        s.vy = s.flip ? -PADV : PADV; s.grounded = false; s.ev |= EV_PAD;
      }
    }
    if (s.buf > 0 && !s.ship) {
      const cx = s.x + s.size / 2, cy = s.y + s.size / 2;
      for (let i = 0; i < L.orbs.length; i++) {
        const o = L.orbs[i];
        if (s.orbs & (1 << i)) continue;
        const dx = cx - (o.x + 0.5), dy = cy - (o.y + 0.5);
        if (dx * dx + dy * dy < 0.95 * 0.95) {

          break;

      }

    const m = s.size * (s.wave ? WAVE_INSET : 0.11);   // spike hitbox is a little smaller than the body
    for (const sp of L.spikes) {
      if (sp.x > s.x + 2 || sp.x < s.x - 2) continue;
      if (overlap(s.x + m, s.y + m, s.size - 2 * m, s.size - 2 * m, sp.x + 0.35, sp.down ? sp.y + 0.45 : sp.y, 0.3, 0.55)) {
        if (hurt(s)) return s;
        break;
      }
    }
    if (s.x >= L.end) { s.won = true; return s; }
    s.buf = Math.max(0, s.buf - h);
    s.inv = Math.max(0, s.inv - h);
  }
  return s;
}

const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
const ROOTS = [45, 41, 36, 43];
const ARP = [0, 1, 2, 3, 2, 1, 0, 1, 0, 2, 3, 2, 1, 3, 2, 1];

function initAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  master = actx.createGain(); master.gain.value = muted ? 0 : 0.35; master.connect(actx.destination);
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);

}
function tone(freq, t, dur, type, vol, dest, cutoff) {

  let node = o;

  node.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
}

}

  g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);

function playStep(i, t, bus) {

  if (i >= 32 && (s === 4 || s === 12)) noise(t, 0.16, 0.32, 1600, "bandpass", bus);
  if (s % 2 === 0) tone(mtof(root + (s % 4 === 2 ? 12 : 0)), t, SPB * 1.8, "sawtooth", 0.2, bus, 650);

}
function beatPulse() {

}
function sfxDeath() {

function sfxPad() { if (actx) { const t = actx.currentTime; noise(t, 0.18, 0.18, 2500, "bandpass", master); tone(660, t, 0.15, "triangle", 0.12, master); } }
function sfxOrb() { if (actx) { const t = actx.currentTime; tone(988, t, 0.12, "triangle", 0.12, master); tone(1319, t + 0.04, 0.14, "triangle", 0.08, master); } }

/* ================= Game state ================= */
let mode = "menu";               // menu | play | dead | paused | win
let P = newState();
let attempts = 0, angle = 0, squash = 0, camX = 0, camY = 0, shake = 0, deadTimer = 0, acc = 0, trailT = 0;
let held = false, pressQueued = false, flapT = 0, waveTrail = [];
let particles = [];
let fruit = store.get("jr_fruit", "apple");
if (fruit === "orange") fruit = "avocado";
let levelIdx = Math.min(LEVELS.length - 1, Math.max(0, Number(store.get("jr_level", 0)) || 0));
L = buildLevel(LEVELS[levelIdx]);
const bestKey = (id = L.id, pct = speedPct) => `jr_best_${id}_${pct}`;
let best = store.get(bestKey(), 0);
function setSpeed(pct) {
  speedPct = clampPct(pct); speed = speedPct / 100; store.set("jr_speed_pct", speedPct); best = store.get(bestKey(), 0);
  if (actx && musicOn) { SPB = 60 / (BPM * speed) / 4; musicStart = nextTime - stepIdx * SPB; } else SPB = 60 / (BPM * speed) / 4;
  buildSpeedPickers();
  if (mode === "menu") buildLevelPicker();
  $("bestLine").textContent = bestText();
}
function selectLevel(i) {
  levelIdx = i; store.set("jr_level", i);
  L = buildLevel(LEVELS[i]); best = store.get(bestKey(), 0); camX = -8; camY = 0;
  buildLevelPicker(); $("bestLine").textContent = bestText();
}
function buildLevelPicker() {
  const wrap = $("levelPicker"); wrap.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const b = document.createElement("button");
    b.className = "level-btn" + (i === levelIdx ? " sel" : "");
    b.setAttribute("aria-pressed", i === levelIdx);
    const bst = store.get(bestKey(lv.id), 0);
    b.innerHTML = `<b>${i + 1}. ${lv.name}</b>` +
      `<small>${bst >= 100 ? "Completed ✓" : bst > 0 ? `Best ${bst}%` : "Not played"}</small>`;
    b.onclick = e => { e.currentTarget.blur(); selectLevel(i); };
    wrap.appendChild(b);
  });
  $("menuSub").textContent = `Level ${levelIdx + 1} · ${L.name}`;
}
const bestText = () => best > 0 ? (best >= 100 ? `${L.name} at ${speedPct}% speed: completed!` : `${L.name} best at ${speedPct}% speed: ${best}%`) : "";
// keep every speed slider (menu, pause, win) in sync
function buildSpeedPickers() {
  for (const wrap of document.querySelectorAll(".speeds")) {
    let input = wrap.querySelector("input");
    if (!input) {
      wrap.innerHTML = `<span class="speed-end">50%</span><input type="range" min="${SPEED_MIN}" max="${SPEED_MAX}" step="${SPEED_STEP}" aria-label="Game speed"><span class="speed-end">150%</span><output class="speed-val"></output>`;
      input = wrap.querySelector("input");
      input.addEventListener("input", () => setSpeed(Number(input.value)));
      input.addEventListener("change", () => input.blur());
      input.addEventListener("pointerdown", e => e.stopPropagation());
    }
    input.value = speedPct;
    input.style.setProperty("--fill", ((speedPct - SPEED_MIN) / (SPEED_MAX - SPEED_MIN) * 100) + "%");
    wrap.querySelector(".speed-val").textContent = speedPct + "%";
  }
}

const $ = id => document.getElementById(id);
const menuEl = $("menu"), pauseEl = $("pause"), winEl = $("win"), hudEl = $("hud");
const barFill = $("barFill"), pctEl = $("pct"), muteBtn = $("muteBtn");

function show(el, on) { el.classList.toggle("hidden", !on); }
function fruitDef() { return FRUITS.find(f => f.id === fruit) || FRUITS[0]; }

function buildPicker() {
  const wrap = $("fruitPicker"); wrap.innerHTML = "";
  for (const f of FRUITS) {
    const b = document.createElement("button");
    b.className = "fruit-btn" + (f.id === fruit ? " sel" : "");
    const c = document.createElement("canvas"); c.width = 112; c.height = 112;
    const cc = c.getContext("2d"); cc.translate(56, 58); drawFruit(cc, f.id, 40);
    b.appendChild(c); b.appendChild(document.createTextNode(f.name));
    b.onclick = () => { fruit = f.id; store.set("jr_fruit", fruit); buildPicker(); };
    wrap.appendChild(b);
  }
  $("bestLine").textContent = bestText();
  buildLevelPicker();
}

function startRun() {
  initAudio();
  attempts = 0; respawn();
  show(menuEl, false); show(winEl, false); show(pauseEl, false); show(hudEl, true);
}
function respawn() {
  P = newState(); attempts++; angle = 0; squash = 0; camX = P.x - (W * 0.3) / T; camY = 0; acc = 0;
  particles = []; pressQueued = false; waveTrail = [];
  mode = "play"; startMusic();
}
function die() {
  mode = "dead"; deadTimer = 0.9; shake = 0.6; stopMusic(); sfxDeath();
  const pct = Math.floor(progress() * 100);
  if (pct > best) { best = pct; store.set(bestKey(), best); }
  const f = fruitDef(), cx = P.x + P.size / 2, cy = P.y + P.size / 2;
  const cols = P.seed ? [f.seed, mixHex(f.seed, "#ffffff", 0.4), mixHex(f.seed, "#000000", 0.3)] : f.juice;
  for (let i = 0; i < 46; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 10;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 4, life: 0.6 + Math.random() * 0.7, max: 1.3,
      c: cols[i % 3], r: 0.06 + Math.random() * 0.14, g: 1 });
  }
}
// fruit bursts into juice but the run continues as its seed
function burst() {
  shake = 0.45; sfxBurst();
  const f = fruitDef(), cx = P.x + P.size / 2, cy = P.y + P.size / 2;
  for (let i = 0; i < 40; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 9;
    particles.push({ x: cx, y: cy, vx: Math.cos(a) * sp + 4, vy: Math.sin(a) * sp + 4, life: 0.5 + Math.random() * 0.6, max: 1.1,
      c: f.juice[i % 3], r: 0.06 + Math.random() * 0.13, g: 1 });
  }
}
function win() {
  mode = "win"; stopMusic(); sfxWin();
  best = 100; store.set(bestKey(), 100);
  $("winAttempts").textContent = attempts; $("winJumps").textContent = P.jumps;
  $("winTitle").textContent = `${L.name} complete!`;
  const nxt = LEVELS[levelIdx + 1];
  show($("nextBtn"), !!nxt);
  if (nxt) $("nextBtn").textContent = `Next: ${nxt.name}`;
  $("againBtn").className = nxt ? "btn ghost" : "btn";
  for (let i = 0; i < 80; i++) {
    const a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 9;
    particles.push({ x: P.x, y: P.y + 1, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp + 5, life: 1 + Math.random(), max: 2,
      c: ["#ffe14d", "#ff6ad5", "#7dffb3", "#fff"][i % 4], r: 0.08 + Math.random() * 0.1, g: 0.6 });
  }

}
function pause(on) {
  if (on && mode === "play") {
    mode = "paused"; if (actx) actx.suspend();
    $("pauseInfo").textContent = `Attempt ${attempts} · ${Math.floor(progress() * 100)}% · speed can be changed below`;
    show(pauseEl, true);
  } else if (!on && mode === "paused") {
    mode = "play"; acc = 0; held = false; if (actx) actx.resume(); show(pauseEl, false);
  }
}
function toMenu() {
  if (actx && actx.state === "suspended") actx.resume();
  stopMusic(); mode = "menu"; particles = [];
  show(pauseEl, false); show(winEl, false); show(hudEl, false); show(menuEl, true); buildPicker();
}
const progress = () => Math.max(0, Math.min(1, P.x / L.end));

/* ================= Input ================= */
function press() { held = true; pressQueued = true; }
window.addEventListener("keydown", e => {
  const jumpKey = e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW";
  if (jumpKey) e.preventDefault();
  if (e.code === "KeyM") { setMuted(!muted); return; }
  if ((e.code === "BracketLeft" || e.code === "BracketRight") && mode !== "play" && mode !== "dead") {
    setSpeed(speedPct + (e.code === "BracketRight" ? SPEED_STEP : -SPEED_STEP));
    return;
  }
  if (e.code === "Escape" || e.code === "KeyP") { if (mode === "play") pause(true); else if (mode === "paused") pause(false); return; }
  if (!jumpKey || e.repeat) return;
  if (mode === "menu") { startRun(); held = true; return; }
  if (mode === "win" && !winEl.classList.contains("hidden")) { startRun(); held = true; return; }
  if (mode === "paused") { pause(false); return; }
  press();
});
window.addEventListener("keyup", e => { if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") held = false; });
cv.addEventListener("pointerdown", e => { e.preventDefault(); if (mode === "play" || mode === "dead") press(); });
window.addEventListener("pointerup", () => { held = false; });
window.addEventListener("pointercancel", () => { held = false; });
window.addEventListener("blur", () => { held = false; pause(true); });
document.addEventListener("visibilitychange", () => { if (document.hidden) pause(true); });

/* ================= Rendering helpers ================= */
const hexRGB = h => { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
const mix = (a, b, t) => { const A = hexRGB(a), Bc = hexRGB(b); return "#" + A.map((v, i) => Math.round(v + (Bc[i] - v) * t).toString(16).padStart(2, "0")).join(""); };
function theme(x) {
  const TH = L.themes;
  let i = 0; while (i < TH.length - 1 && x >= TH[i + 1].at - 6) i++;
  const cur = TH[i];
  const prev = TH[i - 1];
  // blend into current from previous during the 6 tiles before cur.at
  if (prev && x < cur.at) {
    const t = Math.max(0, Math.min(1, (x - (cur.at - 6)) / 6));
    return { top: mix(prev.top, cur.top, t), bot: mix(prev.bot, cur.bot, t), ground: mix(prev.ground, cur.ground, t), accent: mix(prev.accent, cur.accent, t) };
  }
  return cur;
}
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------- Kitchen art ---------- */
function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function steel(c, x0, x1) {
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, "#8d97a3"); g.addColorStop(0.35, "#f4f7fa"); g.addColorStop(0.6, "#c3cbd4"); g.addColorStop(1, "#7c8590");
  return g;
}
function glowStroke(c, accent, pulse, lw) {
  c.save(); c.shadowColor = accent; c.shadowBlur = 8 + pulse * 8; c.strokeStyle = accent; c.lineWidth = lw; c.lineJoin = "round"; c.stroke(); c.restore();
}

const UTENSILS = ["knife", "fork", "bread"];
// x = centre of the tile, y = screen y of the tile's base, u = tile size in px
// flip = true draws the utensil hanging point-down from y
function drawUtensil(c, kind, x, y, u, accent, pulse, flip) {
  c.save(); c.translate(x, y); c.scale(1.45, flip ? -1 : 1); x = 0; y = 0;
  drawUtensilBody(c, kind, x, y, u, accent, pulse);
  c.restore();
}
function drawUtensilBody(c, kind, x, y, u, accent, pulse) {
  const lw = Math.max(1.5, u * 0.045);
  // handle (wood with rivets) for knives, slim steel handle for forks
  if (kind === "fork") {
    c.beginPath();
    c.moveTo(x - u * 0.06, y); c.lineTo(x - u * 0.05, y - u * 0.45); c.lineTo(x - u * 0.19, y - u * 0.62);
    c.lineTo(x - u * 0.19, y - u * 0.95); c.lineTo(x - u * 0.13, y - u * 0.95); c.lineTo(x - u * 0.13, y - u * 0.68);
    c.lineTo(x - u * 0.075, y - u * 0.68); c.lineTo(x - u * 0.075, y - u * 0.95); c.lineTo(x - u * 0.025, y - u * 0.95); c.lineTo(x - u * 0.025, y - u * 0.68);
    c.lineTo(x + u * 0.025, y - u * 0.68); c.lineTo(x + u * 0.025, y - u * 0.95); c.lineTo(x + u * 0.075, y - u * 0.95); c.lineTo(x + u * 0.075, y - u * 0.68);
    c.lineTo(x + u * 0.13, y - u * 0.68); c.lineTo(x + u * 0.13, y - u * 0.95); c.lineTo(x + u * 0.19, y - u * 0.95);
    c.lineTo(x + u * 0.19, y - u * 0.62); c.lineTo(x + u * 0.05, y - u * 0.45); c.lineTo(x + u * 0.06, y); c.closePath();
    glowStroke(c, accent, pulse, lw);
    c.fillStyle = steel(c, x - u * 0.2, x + u * 0.2); c.fill();
    c.strokeStyle = "rgba(0,0,0,0.35)"; c.lineWidth = Math.max(1, u * 0.02); c.stroke();
    return;
  }
  // blade
  c.beginPath();
  c.moveTo(x - u * 0.12, y - u * 0.32);
  c.lineTo(x - u * 0.12, y - u * 0.74);
  c.quadraticCurveTo(x - u * 0.06, y - u * 0.9, x + u * 0.01, y - u * 0.97);
  c.quadraticCurveTo(x + u * 0.16, y - u * 0.62, x + u * 0.14, y - u * 0.32);
  c.closePath();
  glowStroke(c, accent, pulse, lw);
  c.fillStyle = steel(c, x - u * 0.13, x + u * 0.15); c.fill();
  c.strokeStyle = "rgba(0,0,0,0.35)"; c.lineWidth = Math.max(1, u * 0.02); c.stroke();
  if (kind === "bread") { // serrated edge
    c.strokeStyle = "#5d6670"; c.lineWidth = Math.max(1, u * 0.02); c.beginPath();
    for (let t = 0; t < 7; t++) {
      const yy = y - u * (0.36 + t * 0.06);
      c.moveTo(x + u * 0.14, yy); c.lineTo(x + u * 0.09, yy - u * 0.03);
    }
    c.stroke();
  } else { // edge shine
    c.strokeStyle = "rgba(255,255,255,0.8)"; c.lineWidth = Math.max(1, u * 0.02);
    c.beginPath(); c.moveTo(x + u * 0.11, y - u * 0.36); c.quadraticCurveTo(x + u * 0.12, y - u * 0.62, x + u * 0.01, y - u * 0.9); c.stroke();
  }
  // bolster + handle
  c.fillStyle = "#9aa3ad"; c.fillRect(x - u * 0.14, y - u * 0.36, u * 0.3, u * 0.06);
  rr(c, x - u * 0.1, y - u * 0.31, u * 0.2, u * 0.31, u * 0.04);
  c.fillStyle = kind === "bread" ? "#1d1d22" : "#4a2c18"; c.fill();
  c.fillStyle = "#d9c7a0";
  for (const ry of [0.08, 0.21]) { c.beginPath(); c.arc(x, y - u * ry, u * 0.03, 0, Math.PI * 2); c.fill(); }
}

function applianceType(b) {
  if (b.kind) return b.kind;
  if (b.y > 0) return "board";
  if (b.h >= 3) return "fridge";
  if (b.h === 2) return "oven";
  if (b.w === 1) return "toaster";
  if (b.w === 2) return "microwave";
  return "counter";
}
// x,y = top-left in px; w,h = size in px; u = tile size
function drawAppliance(c, b, x, y, w, h, u, accent, pulse) {
  const type = applianceType(b), lw = Math.max(2, u * 0.06), thin = Math.max(1, u * 0.025);
  // silhouette with glow so it reads as solid against any background
  rr(c, x, y, w, h, u * 0.08); glowStroke(c, accent, pulse, lw);

  if (type === "toaster") {
    rr(c, x, y, w, h, u * 0.18); c.fillStyle = steel(c, x, x + w); c.fill();
    c.fillStyle = "#2a2a2e";
    rr(c, x + w * 0.18, y + h * 0.08, w * 0.64, h * 0.07, h * 0.03); c.fill();
    rr(c, x + w * 0.18, y + h * 0.2, w * 0.64, h * 0.07, h * 0.03); c.fill();
    c.fillStyle = "#d9a35b"; c.fillRect(x + w * 0.22, y + h * 0.085, w * 0.56, h * 0.03); // toast peeking
    c.fillStyle = "#e85d4a"; rr(c, x + w * 0.08, y + h * 0.42, w * 0.84, h * 0.1, h * 0.05); c.fill(); // stripe
    c.fillStyle = "#333"; c.beginPath(); c.arc(x + w * 0.3, y + h * 0.72, u * 0.07, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#222"; rr(c, x + w * 0.62, y + h * 0.62, w * 0.2, h * 0.08, h * 0.03); c.fill(); // lever
    c.fillStyle = "#555"; c.fillRect(x + w * 0.1, y + h * 0.94, w * 0.15, h * 0.06); c.fillRect(x + w * 0.75, y + h * 0.94, w * 0.15, h * 0.06);
  } else if (type === "microwave") {
    rr(c, x, y, w, h, u * 0.08); c.fillStyle = "#eef0f2"; c.fill();
    c.strokeStyle = "#9aa1a8"; c.lineWidth = thin; c.stroke();
    rr(c, x + w * 0.06, y + h * 0.14, w * 0.6, h * 0.7, u * 0.06); c.fillStyle = "#1b2430"; c.fill();
    c.fillStyle = "rgba(255,210,120,0.25)"; rr(c, x + w * 0.1, y + h * 0.2, w * 0.52, h * 0.58, u * 0.05); c.fill(); // warm glow inside
    c.strokeStyle = "rgba(255,255,255,0.35)"; c.lineWidth = thin; c.beginPath();
    c.moveTo(x + w * 0.14, y + h * 0.7); c.lineTo(x + w * 0.3, y + h * 0.25); c.stroke();
    c.fillStyle = "#111"; rr(c, x + w * 0.72, y + h * 0.14, w * 0.22, h * 0.16, u * 0.03); c.fill();
    c.fillStyle = "#4dff8a"; c.font = `700 ${Math.round(u * 0.13)}px ui-monospace, monospace`; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillText("0:30", x + w * 0.83, y + h * 0.225);
    c.fillStyle = "#b8bec5";
    for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) { rr(c, x + w * (0.735 + j * 0.105), y + h * (0.4 + i * 0.15), w * 0.085, h * 0.1, u * 0.02); c.fill(); }
  } else if (type === "oven") {
    rr(c, x, y, w, h, u * 0.08); c.fillStyle = steel(c, x, x + w); c.fill();
    c.fillStyle = "#30343a"; c.fillRect(x, y, w, h * 0.06);                          // cooktop edge
    c.fillStyle = "#3a3f46"; c.fillRect(x + w * 0.04, y + h * 0.08, w * 0.92, h * 0.16); // control panel
    for (let i = 0; i < 4; i++) { c.fillStyle = "#e9ecef"; c.beginPath(); c.arc(x + w * (0.16 + i * 0.12), y + h * 0.16, u * 0.07, 0, Math.PI * 2); c.fill(); }
    c.fillStyle = "#ff7a3d"; c.beginPath(); c.arc(x + w * 0.82, y + h * 0.16, u * 0.05, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#c9cfd6"; rr(c, x + w * 0.15, y + h * 0.3, w * 0.7, h * 0.05, u * 0.03); c.fill(); // handle
    rr(c, x + w * 0.1, y + h * 0.4, w * 0.8, h * 0.48, u * 0.08); c.fillStyle = "#15181d"; c.fill();
    const og = c.createRadialGradient(x + w / 2, y + h * 0.7, 0, x + w / 2, y + h * 0.7, w * 0.4);
    og.addColorStop(0, `rgba(255,140,40,${0.45 + pulse * 0.2})`); og.addColorStop(1, "rgba(255,140,40,0)");
    c.fillStyle = og; rr(c, x + w * 0.1, y + h * 0.4, w * 0.8, h * 0.48, u * 0.08); c.fill();
    c.strokeStyle = "rgba(255,255,255,0.2)"; c.lineWidth = thin; c.beginPath(); c.moveTo(x + w * 0.2, y + h * 0.58); c.lineTo(x + w * 0.8, y + h * 0.58); c.stroke();
  } else if (type === "fridge") {
    rr(c, x, y, w, h, u * 0.14); c.fillStyle = "#bfe8dd"; c.fill();
    c.fillStyle = "rgba(255,255,255,0.35)"; c.fillRect(x + w * 0.06, y + u * 0.1, w * 0.06, h - u * 0.25);
    c.strokeStyle = "#6fa597"; c.lineWidth = thin * 1.4; c.beginPath(); c.moveTo(x, y + h * 0.34); c.lineTo(x + w, y + h * 0.34); c.stroke();
    c.fillStyle = "#e9f5f1"; rr(c, x + w * 0.84, y + h * 0.08, w * 0.05, h * 0.18, u * 0.03); c.fill(); rr(c, x + w * 0.84, y + h * 0.42, w * 0.05, h * 0.28, u * 0.03); c.fill();
    // fruit magnets + a note
    const mag = (mx, my, col) => { c.fillStyle = col; c.beginPath(); c.arc(mx, my, u * 0.09, 0, Math.PI * 2); c.fill(); c.fillStyle = "#3fbf4a"; c.beginPath(); c.ellipse(mx + u * 0.05, my - u * 0.1, u * 0.06, u * 0.03, -0.5, 0, Math.PI * 2); c.fill(); };
    mag(x + w * 0.3, y + h * 0.18, "#e8322f"); mag(x + w * 0.55, y + h * 0.2, "#ff9a1f");
    c.save(); c.translate(x + w * 0.38, y + h * 0.55); c.rotate(-0.08);
    c.fillStyle = "#fff8c4"; c.fillRect(-u * 0.32, -u * 0.3, u * 0.64, u * 0.6);
    c.strokeStyle = "#c9b86a"; c.lineWidth = thin;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(-u * 0.22, -u * 0.12 + i * u * 0.14); c.lineTo(u * 0.22, -u * 0.12 + i * u * 0.14); c.stroke(); }
    c.restore();
    mag(x + w * 0.38, y + h * 0.55 - u * 0.3, "#e0234e");
  } else if (type === "counter") {
    c.fillStyle = "#f3ead8"; c.fillRect(x, y, w, h);
    const top = h * 0.2, wg = c.createLinearGradient(0, y, 0, y + top);
    wg.addColorStop(0, "#d79a5b"); wg.addColorStop(1, "#a8683a");
    c.fillStyle = wg; c.fillRect(x - u * 0.04, y, w + u * 0.08, top);           // butcher-block top
    c.strokeStyle = "rgba(90,45,15,0.45)"; c.lineWidth = thin;
    for (let i = 1; i < b.w * 3; i++) { c.beginPath(); c.moveTo(x + (i * u) / 3, y); c.lineTo(x + (i * u) / 3, y + top); c.stroke(); }
    c.strokeStyle = "#c8b896";
    for (let i = 0; i < b.w; i++) {
      const cx = x + i * u;
      c.strokeRect(cx + u * 0.08, y + top + u * 0.08, u * 0.84, h - top - u * 0.16);
      c.fillStyle = "#8a7a5c"; rr(c, cx + u * 0.38, y + top + u * 0.16, u * 0.24, u * 0.05, u * 0.02); c.fill();
    }
  } else if (type === "cabinet") { // upper cupboard hanging from the ceiling
    const dh = Math.min(h, u * 2.4), dy = y + h - dh;        // doors only on the lowest 2.4 tiles
    c.fillStyle = "#4a3a2a"; c.fillRect(x, y, w, h - dh);      // dark wall/soffit above the doors
    c.fillStyle = "#f3ead8"; c.fillRect(x, dy, w, dh);
    const doors = Math.max(1, Math.round(b.w / 1.5)), dw = w / doors;
    c.strokeStyle = "#c8b896"; c.lineWidth = thin;
    for (let i = 0; i < doors; i++) {
      c.strokeRect(x + i * dw + u * 0.08, dy + u * 0.1, dw - u * 0.16, dh - u * 0.3);
      c.fillStyle = "#8a7a5c";
      rr(c, x + i * dw + (i % 2 ? u * 0.18 : dw - u * 0.26), y + h - u * 0.75, u * 0.08, u * 0.4, u * 0.03); c.fill();
    }
    c.fillStyle = "#a8683a"; c.fillRect(x - u * 0.04, y + h - u * 0.14, w + u * 0.08, u * 0.14);   // trim
    const lg = c.createLinearGradient(0, y + h, 0, y + h + u * 0.9);                            // under-cupboard light
    lg.addColorStop(0, `rgba(255,240,180,${0.28 + pulse * 0.1})`); lg.addColorStop(1, "rgba(255,240,180,0)");
    c.fillStyle = lg; c.fillRect(x, y + h, w, u * 0.9);
  } else { // floating cutting board
    const wg = c.createLinearGradient(0, y, 0, y + h);
    wg.addColorStop(0, "#e0a96a"); wg.addColorStop(1, "#a86a38");
    rr(c, x, y, w, h, u * 0.25); c.fillStyle = wg; c.fill();
    c.strokeStyle = "rgba(90,45,15,0.35)"; c.lineWidth = thin;
    for (let i = 0; i < 3; i++) { c.beginPath(); c.moveTo(x + u * 0.5, y + h * (0.3 + i * 0.2)); c.bezierCurveTo(x + w * 0.4, y + h * (0.2 + i * 0.2), x + w * 0.6, y + h * (0.45 + i * 0.2), x + w - u * 0.9, y + h * (0.3 + i * 0.2)); c.stroke(); }
    c.fillStyle = "rgba(40,15,5,0.85)"; rr(c, x + w - u * 0.6, y + h * 0.38, u * 0.32, h * 0.24, h * 0.12); c.fill(); // handle hole
  }
}

// the fruit rides in a little saucer: hull, fins, glass dome, thruster flame
function drawShip(c, kind, r, flame, isSeed) {
  if (flame > 0) {
    const len = r * (0.7 + flame * 5);
    const fg = c.createLinearGradient(-r * 1.1, 0, -r * 1.1 - len, 0);
    fg.addColorStop(0, "#fff6a8"); fg.addColorStop(0.4, "#ffb020"); fg.addColorStop(1, "rgba(255,60,0,0)");
    c.fillStyle = fg; c.beginPath(); c.moveTo(-r * 1.0, r * 0.18); c.lineTo(-r * 1.1 - len, r * 0.36); c.lineTo(-r * 1.0, r * 0.56); c.closePath(); c.fill();
  }
  c.fillStyle = "#e85d4a"; c.strokeStyle = "#7a1e12"; c.lineWidth = r * 0.06;
  c.beginPath(); c.moveTo(-r * 0.9, r * 0.25); c.lineTo(-r * 1.25, -r * 0.15); c.lineTo(-r * 0.55, r * 0.2); c.closePath(); c.fill(); c.stroke();   // tail fin
  const hg = c.createLinearGradient(0, r * 0.05, 0, r * 0.75);
  hg.addColorStop(0, "#f4f7fa"); hg.addColorStop(0.5, "#b9c2cc"); hg.addColorStop(1, "#6d7680");
  c.fillStyle = hg; c.strokeStyle = "#3c434b"; c.lineWidth = r * 0.07;
  c.beginPath(); c.ellipse(0, r * 0.38, r * 1.15, r * 0.36, 0, 0, Math.PI * 2); c.fill(); c.stroke();                       // hull
  c.fillStyle = "#ffe14d";
  for (const lx of [-0.55, 0, 0.55]) { c.beginPath(); c.arc(lx * r, r * 0.42, r * 0.08, 0, Math.PI * 2); c.fill(); }      // lights
  c.save(); c.translate(0, -r * 0.12); c.scale(0.62, 0.62); if (isSeed) drawSeed(c, kind, r * 0.75); else drawFruit(c, kind, r); c.restore();                           // pilot
  c.fillStyle = "rgba(170,225,255,0.22)"; c.strokeStyle = "rgba(220,245,255,0.8)"; c.lineWidth = r * 0.05;
  c.beginPath(); c.arc(0, r * 0.12, r * 0.72, Math.PI, 0); c.closePath(); c.fill(); c.stroke();                         // dome
  c.strokeStyle = "rgba(255,255,255,0.7)"; c.lineWidth = r * 0.06;
  c.beginPath(); c.arc(0, r * 0.12, r * 0.58, Math.PI * 1.15, Math.PI * 1.4); c.stroke();
}

// wave vehicle: a paper dart pointing where it's heading, with the fruit (or seed) as pilot
function drawWave(c, kind, r, isSeed) {
  const f = FRUITS.find(f => f.id === kind) || FRUITS[0];
  const g = c.createLinearGradient(-r, 0, r * 1.2, 0);
  g.addColorStop(0, f.juice[1]); g.addColorStop(1, f.juice[0]);
  c.fillStyle = g; c.strokeStyle = f.dark; c.lineWidth = r * 0.08; c.lineJoin = "round";
  c.beginPath(); c.moveTo(r * 1.15, 0); c.lineTo(-r * 0.85, -r * 0.7); c.lineTo(-r * 0.45, 0); c.lineTo(-r * 0.85, r * 0.7); c.closePath();
  c.fill(); c.stroke();
  c.strokeStyle = "rgba(255,255,255,0.55)"; c.lineWidth = r * 0.05;
  c.beginPath(); c.moveTo(r * 1.0, 0); c.lineTo(-r * 0.45, 0); c.stroke();
  c.save(); c.translate(-r * 0.05, 0); c.scale(0.42, 0.42);
  if (isSeed) drawSeed(c, kind, r * 0.8); else drawFruit(c, kind, r);
  c.restore();
}

function render(dt) {
  const th = theme(camX + (W * 0.3) / T);
  const pulse = beatPulse();
  const shX = shake > 0 ? (Math.random() - 0.5) * shake * T * 0.5 : 0;
  const shY = shake > 0 ? (Math.random() - 0.5) * shake * T * 0.5 : 0;
  const groundY = Hh * 0.8;
  const sx = x => (x - camX) * T + shX;
  const sy = y => groundY - (y - camY) * T + shY;

  // sky
  const g = ctx.createLinearGradient(0, 0, 0, Hh);
  g.addColorStop(0, th.top); g.addColorStop(1, th.bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh);

  // distant fruit silhouettes
  const par1 = camX * 0.12;
  for (let k = Math.floor(par1 / 7) - 2; k < Math.floor(par1 / 7) + W / T / 7 + 3; k++) {
    const r = (1.2 + hash(k) * 2.2) * T, x = (k * 7 - par1) * T, y = Hh * (0.2 + hash(k + 9) * 0.45) + camY * T * 0.1;
    ctx.globalAlpha = 0.07 + pulse * 0.03; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + r * 0.35, y - r * 1.0, r * 0.3, r * 0.13, -0.5, 0, Math.PI * 2); ctx.fill();
  }
  // mid-layer grid squares
  const par2 = camX * 0.45, gs = 2.5;
  ctx.globalAlpha = 0.06; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5;
  for (let k = Math.floor(par2 / gs) - 1; k < Math.floor(par2 / gs) + W / T / gs + 2; k++) {
    for (let j = 0; j < 4; j++) {
      if (hash(k * 7 + j) < 0.55) continue;
      ctx.strokeRect((k * gs - par2) * T, groundY - (j + 1.5) * gs * T + camY * T * 0.45, gs * T * 0.8, gs * T * 0.8);
    }
  }
  ctx.globalAlpha = 1;

  // hints
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `600 ${Math.round(T * 0.42)}px Fredoka, system-ui, sans-serif`;
  ctx.fillStyle = "rgba(255,255,255,0.85)";
  for (const h of L.hints) if (sx(h.x) > -400 && sx(h.x) < W + 400) ctx.fillText(h.text, sx(h.x), sy(h.y));
  ctx.font = `700 ${Math.round(T * 0.75)}px Fredoka, system-ui, sans-serif`;
  ctx.fillStyle = "rgba(255,255,255,0.9)";
  if (mode !== "menu") ctx.fillText(`Attempt ${attempts}`, sx(5), sy(4.6));

  // finish gate
  const fx = sx(L.end);
  if (fx < W + 200) {
    const fg = ctx.createLinearGradient(fx - T, 0, fx + T * 1.5, 0);
    fg.addColorStop(0, "rgba(255,255,255,0)"); fg.addColorStop(0.5, "rgba(255,255,255,0.45)"); fg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = fg; ctx.fillRect(fx - T, 0, T * 2.5, sy(0));
    const sq = T * 0.4;
    for (let j = 0; j < Math.ceil(sy(0) / sq); j++) for (let i = 0; i < 2; i++) {
      ctx.fillStyle = (i + j) % 2 ? "#111" : "#fff";
      ctx.fillRect(fx + i * sq, sy(0) - (j + 1) * sq, sq, sq);
    }
  }

  // ground
  const gy = sy(0);
  ctx.fillStyle = th.ground; ctx.fillRect(0, gy, W, Hh - gy + 50);
  // checkered kitchen floor tiles
  ctx.fillStyle = "rgba(255,255,255,0.07)";
  for (let k = Math.floor(camX) - 1; k < camX + W / T + 2; k++)
    for (let j = 0; j * T < Hh - gy + T; j++) if ((k + j) % 2 === 0) ctx.fillRect(sx(k), gy + j * T, T, T);
  ctx.save(); ctx.shadowColor = th.accent; ctx.shadowBlur = 12 + pulse * 10;
  ctx.fillStyle = th.accent; ctx.fillRect(0, gy - 1, W, 3); ctx.restore();

  const vis = x => sx(x) > -T * 8 && sx(x) < W + T;

  // blocks (kitchen appliances)
  for (const b of L.blocks) {
    if (sx(b.x + b.w) < -T || sx(b.x) > W + T) continue;   // off-screen (works for very long blocks too)
    drawAppliance(ctx, b, sx(b.x), sy(b.y + b.h), b.w * T, b.h * T, T, th.accent, pulse);
  }

  // spikes (upright knives & forks)
  for (const s of L.spikes) {
    if (!vis(s.x)) continue;
    const kind = UTENSILS[Math.floor(hash(s.x * 3 + s.y) * UTENSILS.length)];
    if (s.down) drawUtensil(ctx, kind, sx(s.x + 0.5), sy(s.y + 1), T, th.accent, pulse, true);
    else drawUtensil(ctx, kind, sx(s.x + 0.5), sy(s.y), T, th.accent, pulse);
  }

  // pads (sizzling frying pans)
  for (const p of L.pads) {
    if (!vis(p.x)) continue;
    const cx = sx(p.x + 0.5), by = sy(p.y);
    ctx.save(); ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 14 + pulse * 10;
    ctx.fillStyle = "#2b2b30"; ctx.strokeStyle = "#111"; ctx.lineWidth = Math.max(1, T * 0.03);
    rr(ctx, cx - T * 0.95, by - T * 0.16, T * 0.5, T * 0.08, T * 0.04); ctx.fill();               // handle
    ctx.beginPath(); ctx.moveTo(cx - T * 0.46, by - T * 0.2); ctx.lineTo(cx + T * 0.46, by - T * 0.2);
    ctx.lineTo(cx + T * 0.38, by); ctx.lineTo(cx - T * 0.38, by); ctx.closePath(); ctx.fill(); ctx.stroke(); // pan
    ctx.restore();
    ctx.fillStyle = "#fffaf0";
    ctx.beginPath(); ctx.ellipse(cx, by - T * 0.22, T * 0.3, T * 0.07, 0, 0, Math.PI * 2); ctx.fill();   // egg white
    ctx.save(); ctx.shadowColor = "#ffb300"; ctx.shadowBlur = 10 + pulse * 8; ctx.fillStyle = "#ffc21a";
    ctx.beginPath(); ctx.ellipse(cx + T * 0.03, by - T * 0.25, T * 0.12, T * (0.08 + pulse * 0.02), 0, Math.PI, 0); ctx.fill(); ctx.restore();
    ctx.fillStyle = "rgba(255,225,77,0.25)";
    ctx.beginPath(); ctx.moveTo(sx(p.x + 0.5), sy(p.y + 1.3)); ctx.lineTo(sx(p.x + 0.2), sy(p.y + 0.8)); ctx.lineTo(sx(p.x + 0.8), sy(p.y + 0.8)); ctx.fill();
  }

  // transform portals (glowing oven-door ovals)
  L.portals.forEach(pt => {
    if (!vis(pt.x)) return;
    const PORTAL_STYLE = { ship: ["#ff5cf0", "🚀"], cube: ["#5cf0ff", "🍒"], flip: ["#7dff6a", "🙃"], normal: ["#ffd23f", "🙂"], wave: ["#5cffb0", "🌊"] };
    const [col, icon] = PORTAL_STYLE[pt.mode];
    const cx = sx(pt.x + 0.5), cy = sy(2.2), rx = T * 0.55, ry = T * 2.1;
    ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 20 + pulse * 14;
    ctx.strokeStyle = col; ctx.lineWidth = T * 0.16;
    ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    ctx.fillStyle = col + "2e";
    ctx.beginPath(); ctx.ellipse(cx, cy, rx * 0.8, ry * 0.92, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `700 ${Math.round(T * 0.42)}px Fredoka, system-ui, sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(icon, cx, cy);
  });

  // orbs (rings)
  L.orbs.forEach((o, i) => {
    if (!vis(o.x)) return;
    const used = mode !== "menu" && (P.orbs & (1 << i));
    const cx = sx(o.x + 0.5), cy = sy(o.y + 0.5), r = T * 0.38 * (1 + pulse * 0.1);
    ctx.globalAlpha = used ? 0.25 : 1;
    ctx.save(); ctx.shadowColor = "#ffe14d"; ctx.shadowBlur = 18;
    ctx.strokeStyle = "#ffe14d"; ctx.lineWidth = T * 0.09; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "rgba(255,225,77,0.35)"; ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r * (1.3 + ((performance.now() / 600) % 1) * 0.6), 0, Math.PI * 2);
    ctx.globalAlpha = (used ? 0.1 : 0.4) * (1 - ((performance.now() / 600) % 1)); ctx.stroke();
    ctx.globalAlpha = 1;
  });

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life / 0.4));
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), p.r * T, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // wave trail: a glowing zig-zag line behind the dart
  if (waveTrail.length > 1) {
    ctx.save(); ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.shadowColor = fruitDef().juice[0]; ctx.shadowBlur = 12;
    ctx.strokeStyle = fruitDef().juice[0]; ctx.lineWidth = T * 0.14;
    ctx.beginPath(); waveTrail.forEach((p, i) => i ? ctx.lineTo(sx(p.x), sy(p.y)) : ctx.moveTo(sx(p.x), sy(p.y))); ctx.stroke();
    ctx.shadowBlur = 0; ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = T * 0.04; ctx.stroke();
    ctx.restore();
  }

  // player
  if (mode === "play" || mode === "paused" || (mode === "win" && particles.length)) {
    if (mode !== "win") {
      ctx.save();
      ctx.translate(sx(P.x + P.size / 2), sy(P.y + P.size / 2) + squash * T * 0.08 * (P.flip && !P.ship && !P.wave ? -1 : 1));
      if (P.inv > 0 && Math.floor(P.inv * 16) % 2) ctx.globalAlpha = 0.45;   // blink while invulnerable
      ctx.scale(1 + 0.22 * squash, (1 - 0.22 * squash) * (P.flip && !P.ship && !P.wave ? -1 : 1));   // upside down when gravity is flipped
      ctx.rotate(angle);
      if (P.wave) drawWave(ctx, fruit, T * 0.5, P.seed);
      else if (P.ship) drawShip(ctx, fruit, T * 0.5, flapT, P.seed);
      else if (P.seed) drawSeed(ctx, fruit, T * 0.5 * (SEED / PS));
      else drawFruit(ctx, fruit, T * 0.5);
      ctx.restore();
    }
  }
}

/* ================= Main loop ================= */
let last = performance.now();
function emitTrail(ship) {
  const f = fruitDef();
  if (ship) { particles.push({ x: P.x - 0.2, y: P.y + 0.35, vx: -4 - Math.random() * 2, vy: (Math.random() - 0.5) * 1.5, life: 0.3, max: 0.3, c: ["#ffb020", "#fff6a8"][Math.random() < 0.5 ? 0 : 1], r: 0.05 + Math.random() * 0.06, g: 0 }); return; }
  particles.push({ x: P.x + 0.1, y: P.flip ? P.y + P.size - 0.05 : P.y + 0.05, vx: -2 - Math.random() * 2, vy: 1 + Math.random() * 2, life: 0.35, max: 0.35, c: f.juice[Math.floor(Math.random() * 2)], r: 0.05 + Math.random() * 0.05, g: 0.5 });
}
function updateParticles(dt) {
  for (const p of particles) { p.vy -= 30 * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.y < 0 && p.g) { p.y = 0; p.vy *= -0.3; p.vx *= 0.7; } p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
}
function frame(now) {
  const realDt = Math.min(0.05, (now - last) / 1000); last = now;
  const dt = realDt * speed;   // game time runs at the chosen speed
  if (mode === "play") {
    acc += dt;
    while (acc >= STEP) {
      simStep(P, held, pressQueued, 1); pressQueued = false; acc -= STEP;
      if (P.ev) {
        if (P.ev & EV_LAND) squash = 1;
        if (P.ev & EV_PORTAL) { sfxPortal(); shake = 0.25; }
        if (P.ev & EV_BURST) burst();
        if (P.ev & EV_PAD) sfxPad();
        if (P.ev & EV_ORB) sfxOrb();
        P.ev = 0;
      }
      if (P.dead) { die(); break; }
      if (P.won) { win(); break; }
    }
    if (mode === "play") {
      if (!P.wave && waveTrail.length) waveTrail.splice(0, 3);   // trail fades out after leaving wave mode
      flapT = P.thrust ? Math.min(0.14, flapT + dt) : Math.max(0, flapT - dt);   // flame grows while holding
      if (P.wave) {
        angle = P.vy > 0 ? -Math.PI / 4 : Math.PI / 4;   // snaps to 45° up or down
        waveTrail.push({ x: P.x + P.size / 2, y: P.y + P.size / 2 });
        if (waveTrail.length > 90) waveTrail.shift();
      } else if (P.ship) {
        // nose follows the vertical speed
        const target = Math.max(-0.4, Math.min(0.4, -P.vy * 0.06));
        angle = Math.atan2(Math.sin(angle), Math.cos(angle));   // wrap leftover spin into -π..π
        angle += (target - angle) * Math.min(1, dt * 14);
        if (flapT > 0 || Math.random() < 0.3) { trailT -= dt; if (trailT <= 0) { emitTrail(true); trailT = 0.03; } }
      } else if (P.grounded) {
        const target = Math.round(angle / (Math.PI / 2)) * (Math.PI / 2);
        angle += (target - angle) * Math.min(1, dt * 22);
        trailT -= dt; if (trailT <= 0) { emitTrail(); trailT = 0.035; }
      } else angle += 7.6 * dt;   // (mirrored by the flip scale when upside down)
    }
    barFill.style.width = (progress() * 100).toFixed(1) + "%";
    pctEl.textContent = Math.floor(progress() * 100) + "%";
  } else if (mode === "dead") {
    deadTimer -= realDt; if (deadTimer <= 0) respawn();
  }
  if (mode !== "paused") {
    updateParticles(dt);
    squash = Math.max(0, squash - dt * 6);
    shake = Math.max(0, shake - dt * 2);
    if (mode === "play") {
      camX = P.x - (W * 0.3) / T;
      const ty = (P.ship || P.wave) ? 0 : Math.max(0, P.y - (P.flip ? 4 : 3));
      camY += (ty - camY) * Math.min(1, dt * 5);
    } else if (mode === "menu") {
      camX += SPEED * 0.35 * realDt; if (camX > L.end) camX = -10;
    }
  }
  render(dt);
  scheduleMusic();
  requestAnimationFrame(frame);
}
camX = -8;
buildSpeedPickers();
buildLevelPicker();
buildPicker();
requestAnimationFrame(frame);

// exposed for automated level testing
window.JR = { simStep, newState, LEVELS, useLevel: i => { L = buildLevel(LEVELS[i]); return L; }, warp: x => { if (mode === "dead") respawn(); if (mode === "play") { P.x = x; P.y = 0; P.vy = 0; camX = P.x - (W * 0.3) / T; } }, freeze: on => { pause(on); show(pauseEl, false); },
  // test hook: advance the run by `sec` of game time without input, independent of frame rate
  tick: sec => { for (let i = 0; i < sec / STEP && !P.dead; i++) simStep(P, false, false, 1); P.ev = 0; camX = P.x - (W * 0.3) / T; camY = (P.ship || P.wave) ? 0 : Math.max(0, P.y - (P.flip ? 4 : 3)); waveTrail = []; } };
})();
</script>
